name: Sync content from upstream

# check-drift.yml detects drift and opens an issue; this workflow closes the
# loop. When the upstream game repo moves, a Claude Code agent runs the
# .claude/skills/openmmo-wiki-sync skill: syncs game data, fills zh/ko names
# for new content, extends the changelog per protocol bump, documents new
# gameplay systems in all three locales, verifies the build, and pushes.
#
# Requires one repo secret: CLAUDE_CODE_OAUTH_TOKEN (from `claude
# setup-token`, uses a Claude subscription) or ANTHROPIC_API_KEY (metered).

on:
  schedule:
    - cron: '17 22 * * *' # daily 06:17 Asia/Taipei
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write # to kick deploy.yml after an agent push

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/OpenMMO-Agent-UI/OpenMMO
  # The desktop client, watched for the same reason and separately: the wiki
  # documents its panel, and that panel moves on its own schedule. Watching
  # only the game repo is why `client/panel.mdx` sat at client v0.19.0 while
  # the client reached v0.79.0 — by then it described six drawers that no
  # longer exist, two settings tabs that had been replaced, and had never
  # once mentioned the Auto Worker, which is most of what the app now does.
  # Nothing was broken enough to notice; it was just quietly wrong for fifty
  # releases, because nothing ever woke up to look.
  CLIENT: https://github.com/OpenMMO-Agent-UI/openmmo-agent-ui

jobs:
  # Cheap gate so the agent only spins up when upstream actually moved.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needs-sync: ${{ steps.cmp.outputs.needs-sync }}
    steps:
      - uses: actions/checkout@v4
      - id: cmp
        run: |
          # Two heads, one recorded line: "<game sha> <client sha>". A line
          # with only one field is the old single-repo state and reads as
          # "the client has never been looked at", which fires one catch-up
          # run rather than silently carrying the gap forward.
          upstream="$(git ls-remote "$UPSTREAM" refs/heads/master | cut -f1)"
          client="$(git ls-remote "$CLIENT" refs/heads/master | cut -f1)"
          read -r was_upstream was_client < <(cat scripts/.last-upstream-sync 2>/dev/null || true)
          if [[ -z $upstream || -z $client ]]; then
            echo "could not read one of the remotes — upstream='$upstream' client='$client'" >&2
            exit 1
          fi
          if [[ $upstream != "$was_upstream" || $client != "$was_client" ]]; then
            echo "needs-sync=true" >> "$GITHUB_OUTPUT"
            echo "game:   ${was_upstream:-<none>} -> $upstream"
            echo "client: ${was_client:-<none>} -> $client"
          else
            echo "needs-sync=false" >> "$GITHUB_OUTPUT"
            echo "nothing to do — game and client both still recorded"
          fi

  sync:
    needs: check
    if: needs.check.outputs.needs-sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Give the agent a git identity
        run: |
          git config user.name "openmmo-wiki-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run the sync skill
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          # Passing the workflow's own token skips the action's OIDC/GitHub-App
          # exchange, which would otherwise require the Claude GitHub App.
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: '/openmmo-wiki-sync'
          show_full_output: true
          claude_args: |
            --model claude-sonnet-5
            --settings .claude/skills/openmmo-wiki-sync/cron-settings.json
      - name: Trigger the Pages deploy if the agent pushed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pushes made with GITHUB_TOKEN never fire `on: push` workflows, so
          # deploy.yml has to be kicked explicitly when main moved this run.
          after="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$after" != "${{ github.sha }}" ]]; then
            gh workflow run deploy.yml --ref main
            echo "main moved to $after — deploy triggered"
          else
            echo "no new commits — no deploy needed"
          fi
