name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Before the build, not after: a link that resolves nowhere is invisible
      # to whoever wrote it — `astro build` is happy, the page looks finished,
      # and the reader finds the 404. Twenty of them had accumulated in the
      # three `updates/index.md` files before anyone noticed, all the same
      # mistake: an `index` page serves one URL segment shallower than its
      # path, so `../../` walks off the base path in zh-TW and silently lands
      # on the zh-TW copy from ko and en.
      - run: npm run check:links
      # Reports coverage per language, and fails on the two things that break a
      # language rather than merely leave it incomplete: a sidebar label with no
      # translation (zh-TW text inside an otherwise translated menu) and a
      # translated page the default locale no longer has.
      - run: npm run check:i18n
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
